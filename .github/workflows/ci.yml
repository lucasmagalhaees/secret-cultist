name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04   # D146: fixed, so an image change does not surprise the CI
    env:
      DLC_KEY: ${{ secrets.DLC_KEY }}   # D138: the expansion's key (not in the repository)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # D154
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the Python test tools
        run: |
          pip install -r tests/requirements.txt
          echo "PW_VERSION=$(pip show playwright | awk '/^Version/{print $2}')" >> "$GITHUB_ENV"
      - name: Cache the Playwright browser   # D154: ~150 MB, downloaded once per Playwright version
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Install the browser and the build tools
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" != 'true' ]; then playwright install chromium; fi
          timeout 150 playwright install-deps chromium || echo 'apt do Ubuntu fora do ar: segue com o que a imagem já tem'   # D146
          npm ci
      - name: Types, build, docs, core, unit and contract checks
        run: scripts/verify.sh --quick

  coverage:
    name: coverage
    runs-on: ubuntu-24.04   # D146: fixed, so an image change does not surprise the CI
    env:
      DLC_KEY: ${{ secrets.DLC_KEY }}   # D138: the expansion's key (not in the repository)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # D154
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the Python test tools
        run: |
          pip install -r tests/requirements.txt
          echo "PW_VERSION=$(pip show playwright | awk '/^Version/{print $2}')" >> "$GITHUB_ENV"
      - name: Cache the Playwright browser   # D154: ~150 MB, downloaded once per Playwright version
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Install the browser and the build tools
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" != 'true' ]; then playwright install chromium; fi
          timeout 150 playwright install-deps chromium || echo 'apt do Ubuntu fora do ar: segue com o que a imagem já tem'   # D146
          npm ci
      - name: Everything, with the coverage minimums
        run: scripts/verify.sh

  e2e:
    name: e2e (${{ matrix.theme }})
    runs-on: ubuntu-24.04   # D146: fixed, so an image change does not surprise the CI
    env:
      DLC_KEY: ${{ secrets.DLC_KEY }}   # D138: the expansion's key (not in the repository)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [dark]  # the light theme e2e left CI on 2026-10-30 (D47): slow and flaky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # D154
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the Python test tools
        run: |
          pip install -r tests/requirements.txt
          echo "PW_VERSION=$(pip show playwright | awk '/^Version/{print $2}')" >> "$GITHUB_ENV"
      - name: Cache the Playwright browser   # D154: ~150 MB, downloaded once per Playwright version
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Install the browser
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" != 'true' ]; then playwright install chromium; fi
          timeout 150 playwright install-deps chromium || echo 'apt do Ubuntu fora do ar: segue com o que a imagem já tem'   # D146
      - name: Build the page the test opens
        run: |
          npm ci
          npm run build
      - name: End to end
        run: python tests/e2e.py ${{ matrix.theme }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.theme }}
          path: tests/shots/
          if-no-files-found: ignore
