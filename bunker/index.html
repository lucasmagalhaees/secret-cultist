<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bunker</title>
<style>
:root { --bg:#16130f; --card:#221d17; --ink:#efe6d4; --dim:#a89c86; --lib:#3f7fd1; --fas:#d1443a; --line:#3a3229; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; padding:env(safe-area-inset-top) 12px 40px }
main { max-width:560px; margin:0 auto }
h1 { font:900 28px/1 Impact, 'Arial Narrow', sans-serif; letter-spacing:.04em; text-transform:uppercase; margin:18px 0 10px }
.card { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:14px; margin:10px 0 }
.label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim) }
input { width:100%; font-size:16px; padding:10px; border-radius:8px; border:2px solid var(--line); background:#0f0d0a; color:var(--ink); margin:4px 0 10px }
button { font:700 16px system-ui; padding:12px; border-radius:8px; border:2px solid var(--line); background:#2e271f; color:var(--ink); cursor:pointer }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink) }
button.lib { background:var(--lib); border-color:var(--lib) } button.fas { background:var(--fas); border-color:var(--fas) }
button.on { outline:3px solid var(--ink) }
button:disabled { opacity:.4 }
.row { display:flex; gap:8px; flex-wrap:wrap } .row > button { flex:1 }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px }
.track { display:flex; gap:4px; margin:6px 0 } .track i { flex:1; height:22px; border-radius:4px; border:2px solid var(--line) }
.track i.L { background:var(--lib) } .track i.F { background:var(--fas) }
ul.seats { list-style:none; padding:0; margin:0 } ul.seats li { padding:6px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between }
.dead { text-decoration:line-through; color:var(--dim) } .tagL { color:var(--lib) } .tagF { color:var(--fas) }
.log { font-size:14px; color:var(--dim); max-height:220px; overflow:auto } .log p { margin:4px 0 }
.err { color:#ff8a80 } .big { font-size:22px; font-weight:800 } .hint { color:var(--dim); font-size:14px }
</style>
</head>
<body><main id="app"></main><script type="module" src="./client.ts"></script></body>
</html>
