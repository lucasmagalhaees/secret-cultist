# D159: the bunker (Secret Hitler and Secret Stalin online, with the shared password) on Cloudflare Workers: the page as
# static assets and the rooms as Durable Objects. Deployed by .github/workflows/bunker.yml.
name = "secret-bunker"
main = "worker.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the free plan only has Durable Objects with SQLite storage
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
